<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유리 비교</title>
<style>
*{box-sizing:border-box}
:root{
  --parchment:#f2f2f7; --canvas:#fff; --ink:#1d1d1f; --ink-48:#6b6b70;
  --primary:#c8641e; --r-lg:26px; --r-pill:9999px;
  --lift-1:0 1px 2px rgba(16,20,35,.06), 0 4px 14px rgba(16,20,35,.06);
}
html,body{margin:0;background:var(--parchment);color:var(--ink);
  font:17px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── 고르는 줄 (비교 도구, 앱 아님) ───────────────────────────── */
#pick{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;gap:6px;
  padding:8px 10px;background:#16161d;color:#fff;overflow-x:auto;
  scrollbar-width:none}
#pick::-webkit-scrollbar{display:none}
#pick button{flex:none;font:600 13px/1 inherit;padding:9px 12px;border-radius:99px;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff}
#pick button.on{background:#fff;color:#16161d;border-color:#fff}
#pick .sep{flex:none;width:1px;background:rgba(255,255,255,.28);margin:2px 3px}

/* ── 앱 흉내 ──────────────────────────────────────────────────── */
#app{padding-top:44px}
.shot{padding:0 0 130px}

.topbar{position:sticky;top:44px;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--parchment)}
.topbar .logo{font-size:20px;font-weight:700;letter-spacing:-.01em}
.topbar .rt{margin-left:auto;display:flex;gap:8px}
.icb{width:38px;height:38px;border-radius:99px;border:0;background:var(--canvas);
  display:grid;place-items:center;box-shadow:var(--lift-1);color:var(--ink)}
.icb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.wrap{padding:0 16px}
.srch{display:flex;align-items:center;gap:8px;padding:11px 14px;margin-bottom:16px;
  border-radius:99px;background:var(--canvas);box-shadow:var(--lift-1);color:var(--ink-48)}
.srch svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round}

h2.sec{font-size:15px;font-weight:600;margin:22px 4px 10px}

.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;
  scrollbar-width:none;-ms-overflow-style:none}
.rail::-webkit-scrollbar{display:none}
.pc{flex:none;width:150px;aspect-ratio:3/4;border-radius:18px;position:relative;
  overflow:hidden;display:flex;align-items:flex-end;padding:10px;
  color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55);
  box-shadow:var(--lift-1)}
.pc .flag{position:absolute;top:8px;left:8px;width:26px;height:18px;border-radius:4px;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}

.card{background:var(--canvas);border:0;border-radius:var(--r-lg);padding:16px;
  margin-bottom:12px;box-shadow:var(--lift-1)}
.card h3{font-size:15px;font-weight:600;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px}
.row .n{margin-left:auto;color:var(--ink-48);font-variant-numeric:tabular-nums}
.bar{flex:1;height:7px;border-radius:99px;background:#e6e6ec;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}

.tabbar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;
  margin-inline:auto;width:min(calc(100% - 32px),420px);z-index:50;
  display:flex;gap:2px;padding:6px;border-radius:var(--r-pill);
  background:rgba(255,255,255,0);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  border:1px solid rgba(255,255,255,.42);
  box-shadow:0 8px 32px rgba(16,20,35,.12), 0 2px 8px rgba(16,20,35,.06)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px 0 4px;min-height:40px;border:0;background:none;border-radius:99px;
  color:rgb(22,22,29);font:inherit}
.tabbar span{font-size:11px}
.tabbar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--primary);font-weight:600;background:rgba(120,120,128,.20)}
.tabbar button.on svg{stroke-width:2.2}

#note{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:55;text-align:center;font:600 12px/1.4 ui-monospace,monospace;padding:0 16px;
  color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.85);pointer-events:none}

/* ══ 유리 · 약 ═══════════════════════════════════════════════════
   떠 있는 «조작물»만 유리로. 읽는 카드는 건드리지 않습니다. */
body.g1 .topbar{background:rgba(242,242,247,.72);
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
body.g1 .icb, body.g1 .srch{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7), var(--lift-1)}
body.g1 .tabbar{
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(16,20,35,.10),
             0 10px 34px rgba(16,20,35,.16), 0 2px 8px rgba(16,20,35,.08)}

/* ══ 유리 · 강 ═══════════════════════════════════════════════════
   읽는 카드까지 반투명. 상단바는 아예 없애고 동그란 단추만 띄웁니다. */
body.g2 .topbar{background:transparent;position:absolute;top:44px;left:0;right:0}
body.g2 #app{padding-top:44px}
body.g2 .shot{padding-top:62px}
body.g2 .icb, body.g2 .srch{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 6px 20px rgba(16,20,35,.12)}
body.g2 .card{
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 8px 26px rgba(16,20,35,.10)}
body.g2 .bar{background:rgba(120,120,128,.18)}
body.g2 .tabbar{
  background:rgba(255,255,255,.30);
  backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 12px 40px rgba(16,20,35,.20)}

/* ══ 굴절 ═════════════════════════════════════════════════════════
   ⚠ **흐림을 올리면 굴절이 «덜» 보입니다.** 뒤가 균일한 색 덩어리가
     되어 오히려 불투명한 판이 됩니다. 유리가 유리로 보이는 것은 뒤가
     안 보여서가 아니라 **보이는데 휘어서**입니다.

   그래서 세 겹으로 나눕니다.
   ① 판 자체 — 흐림 거의 없음(1px). 채도·대비만 올려 «무언가를 통과해
      온 색»으로 만듭니다. 뒤 글자가 읽혀야 합니다.
   ② `::before` 가장자리 띠 — 여기서만 강하게 흐리고 밝힙니다. 렌즈
      가장자리에서 빛이 꺾여 뭉개지는 자리입니다. 가운데는 안 건드립니다.
      (테두리 안쪽 8px 만 남기는 마스크: padding + content-box XOR)
   ③ `::after` 빛 걸린 테두리 — 위 모서리는 밝고 아래는 사라집니다.
      균일한 1px 테두리는 유리가 아니라 «선으로 그린 알약»입니다. */
body.g3 .icb, body.g3 .srch, body.g3 .tabbar, body.g3 .card{
  position:relative; border:0;   /* ⚠ isolation:isolate 를 넣으면 안 됩니다 — 격리군이 생겨 backdrop 이 빕니다 */
  background:rgba(255,255,255,.06);
  backdrop-filter:saturate(190%) contrast(104%) brightness(104%) blur(1px);
  -webkit-backdrop-filter:saturate(190%) contrast(104%) brightness(104%) blur(1px);
  box-shadow:0 10px 30px rgba(16,20,35,.16), 0 2px 8px rgba(16,20,35,.07);
}
body.g3 .icb::before, body.g3 .srch::before,
body.g3 .tabbar::before, body.g3 .card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:8px;
  backdrop-filter:blur(9px) brightness(1.14) saturate(150%);
  -webkit-backdrop-filter:blur(9px) brightness(1.14) saturate(150%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box,
  linear-gradient(#000 0 0); mask-composite:exclude;
}
body.g3 .icb::after, body.g3 .srch::after,
body.g3 .tabbar::after, body.g3 .card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1.2px;
  background:linear-gradient(155deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 30%,
    rgba(255,255,255,.04) 52%, rgba(255,255,255,.55));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box,
  linear-gradient(#000 0 0); mask-composite:exclude;
}
body.g3 .icb::before{padding:5px}
body.g3 .card::before{padding:10px}
/* 상단바는 알약이 아니라 «화면에 붙은 바»라 아래 모서리 한 곳만 꺾입니다. */
body.g3 .topbar{
  background:rgba(242,242,247,.42);
  backdrop-filter:saturate(180%) contrast(103%) blur(1px);
  -webkit-backdrop-filter:saturate(180%) contrast(103%) blur(1px);
  border-bottom:0;position:sticky}
body.g3 .topbar::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:14px;
  pointer-events:none;
  backdrop-filter:blur(9px) brightness(1.1);-webkit-backdrop-filter:blur(9px) brightness(1.1);
  -webkit-mask:linear-gradient(to bottom, transparent, #000);
  mask:linear-gradient(to bottom, transparent, #000)}
body.g3 .bar{background:rgba(120,120,128,.18)}

/* ══ 바탕 ═════════════════════════════════════════════════════════
   ⚠ 유리는 «뒤에 무엇이 있어야» 보입니다. 평평한 회색 위에서는
     어떤 값을 줘도 차이가 안 납니다 — 그래서 바탕을 바꿔 봅니다. */
body.bgphoto{background:
  radial-gradient(60% 45% at 15% 8%, #f2b880 0 40%, transparent 70%),
  radial-gradient(55% 40% at 85% 22%, #8fd0c8 0 40%, transparent 70%),
  radial-gradient(70% 50% at 50% 78%, #b7a6e0 0 40%, transparent 72%),
  linear-gradient(170deg,#ffe9d1,#cfe4f2 55%,#e6dcf5);
  background-attachment:fixed}
</style></head><body class="now">
<div id="pick"></div>
<div id="app"><div class="shot" id="shot"></div></div>
<div id="note"></div>
<nav class="tabbar" id="bar"></nav>
<script>
const ICON={
 home:'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',
 rate:'M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z',
 anal:'M4 20V10M10 20V4M16 20v-7M22 20H2',
 trips:'M4 6h16M4 12h16M4 18h10',
 set:'M12 12a4 4 0 100-8 4 4 0 000 8M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7'};
const TAB=[['home','홈'],['rate','평가'],['anal','분석'],['trips','일정'],['set','프로필']];
document.getElementById('bar').innerHTML=TAB.map(([k,l],i)=>
 `<button class="${i===2?'on':''}"><svg viewBox="0 0 24 24"><path d="${ICON[k]}"/></svg><span>${l}</span></button>`).join('');

const 도시=[['파리','#f0a06a','#8e4b6e'],['로마','#f2c14e','#8a4b2a'],['도쿄','#e8b4c8','#5a3d6b'],
 ['방콕','#7fc4b8','#1f4d6b'],['런던','#9fb8d8','#2c3e63'],['이스탄불','#f3a683','#6b3a4b'],
 ['교토','#a8d5ba','#35604a'],['홍콩','#8ecae6','#1b4965']];
const 국기=['#0b6b3a','#c8102e','#bc002d','#2d2a4a','#012169','#e30a17','#bc002d','#de2910'];

document.getElementById('shot').innerHTML=`
 <div class="topbar">
   <div class="logo">기로</div>
   <div class="rt">
     <button class="icb"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
     <button class="icb"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
   </div>
 </div>
 <div class="wrap">
   <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>도시 찾기</div>
 </div>
 <h2 class="sec" style="margin-left:20px">여기 가보셨어요</h2>
 <div class="rail">${도시.map(([n,a,b],i)=>
   `<div class="pc" style="background:linear-gradient(160deg,${a},${b})">
      <span class="flag" style="background:${국기[i]}"></span>${n}</div>`).join('')}</div>
 <div class="wrap">
   <h2 class="sec">내 성향</h2>
   <div class="card"><h3>축 넷</h3>
     ${[['개척력',78],['미식',54],['속도',31],['깊이',66]].map(([t,v])=>
       `<div class="row">${t}<span class="bar"><i style="width:${v}%"></i></span><span class="n">${v}</span></div>`).join('')}
   </div>
   <div class="card"><h3>발자국</h3>
     <div class="row">다녀온 도시<span class="n">37곳</span></div>
     <div class="row">나라<span class="n">14개국</span></div>
     <div class="row">별 다섯을 준 곳<span class="n">6곳</span></div>
   </div>
   <div class="card"><h3>다음 여행</h3>
     <div class="row">리스본<span class="n">닮은 도시</span></div>
     <div class="row">포르투<span class="n">닮은 도시</span></div>
     <div class="row">발렌시아<span class="n">닮은 도시</span></div>
   </div>
 </div>`;

const 이름={now:'지금 — 유리는 탭바 하나뿐(흐림 2px)',
  g3:'굴절 — 가운데는 비치고 가장자리만 꺾임',
  g1:'약 — 떠 있는 조작물만 유리 (상단바·단추·검색·탭바)',
  g2:'강 — 읽는 카드까지 유리 + 상단바 없앰'};
let 단계='now', 바탕='';
function 칠하기(){
  document.body.className=단계+(바탕?' '+바탕:'');
  document.getElementById('note').textContent=이름[단계]+(바탕?' · 색바탕':' · 회색바탕');
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===단계));
  document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on',b.dataset.b===바탕));
}
document.getElementById('pick').innerHTML=
  ['now','g3','g1','g2'].map(k=>`<button data-s="${k}">${{now:'지금',g3:'굴절',g1:'약',g2:'강'}[k]}</button>`).join('')
  +'<span class="sep"></span>'
  +'<button data-b="">회색</button><button data-b="bgphoto">색바탕</button>';
document.getElementById('pick').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.s) 단계=b.dataset.s; else 바탕=b.dataset.b;
  칠하기();
};
칠하기();
</script></body></html>
