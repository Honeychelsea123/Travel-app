<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light dark;
  --bg:#0b0d10; --panel:#14171c; --line:#232830;
  --fg:#e7eaee; --dim:#98a2b0; --accent:#4c9aff;
  --ok:#3fb950; --bad:#f85149;
  --r:14px;
  --ts:1;                       /* 글자 배율. 나중에 user_prefs 에서 온다 */
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f7f8fa; --panel:#fff; --line:#e3e6ea;
         --fg:#12151a; --dim:#5b6472; }
}
*{ box-sizing:border-box; }
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
  font:calc(15px * var(--ts))/1.6 Pretendard,-apple-system,BlinkMacSystemFont,
       "Segoe UI",system-ui,sans-serif;
  padding:20px 16px 40px;
}
main{ max-width:560px; margin:0 auto; }
h1{ font-size:calc(19px * var(--ts)); margin:0 0 2px; font-weight:650; letter-spacing:-.02em; }
.sub{ color:var(--dim); font-size:calc(13px * var(--ts)); margin:0 0 20px; }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
       padding:14px 16px; margin-bottom:10px; }
.row{ display:flex; align-items:center; gap:10px; }
.row + .row{ margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
.row .label{ flex:1; min-width:0; }
.row .val{ font-variant-numeric:tabular-nums; color:var(--dim); font-size:calc(13px * var(--ts)); }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
.dot.ok{ background:var(--ok); } .dot.bad{ background:var(--bad); }

.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip{ font-size:calc(12px * var(--ts)); padding:3px 9px; border-radius:999px;
       background:var(--bg); border:1px solid var(--line); color:var(--dim); }

pre{ margin:8px 0 0; padding:10px; background:var(--bg); border:1px solid var(--line);
     border-radius:9px; font-size:calc(12px * var(--ts)); overflow-x:auto;
     white-space:pre-wrap; word-break:break-word; color:var(--bad); }
.foot{ color:var(--dim); font-size:calc(11px * var(--ts)); text-align:center; margin-top:22px; }
code{ background:var(--panel); border:1px solid var(--line); padding:1px 5px;
      border-radius:5px; font-size:.92em; }
</style>
</head>
<body>
<main>
  <h1>Travel</h1>
  <p class="sub">연결 확인 — 아직 화면을 만들기 전입니다.</p>

  <div class="card" id="checks">
    <div class="row"><span class="dot" id="d0"></span>
      <span class="label">Supabase 연결</span><span class="val" id="v0">확인 중…</span></div>
    <div class="row"><span class="dot" id="d1"></span>
      <span class="label">나라</span><span class="val" id="v1">—</span></div>
    <div class="row"><span class="dot" id="d2"></span>
      <span class="label">도시</span><span class="val" id="v2">—</span></div>
    <div class="row"><span class="dot" id="d3"></span>
      <span class="label">이동 등급</span><span class="val" id="v3">—</span></div>
    <div class="row"><span class="dot" id="d4"></span>
      <span class="label">도쿄 노선색</span><span class="val" id="v4">—</span></div>
    <div class="row"><span class="dot" id="d5"></span>
      <span class="label">RLS 가 막고 있는지</span><span class="val" id="v5">—</span></div>
  </div>

  <div class="card" id="gradecard" hidden>
    <div class="label">이동 시간 계산</div>
    <div class="chips" id="grades"></div>
  </div>

  <div class="card" id="errcard" hidden>
    <div class="label">오류</div>
    <pre id="err"></pre>
  </div>

  <p class="foot">화면 <code id="build">b2</code> · <span id="ms">—</span></p>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ── 설정 ──────────────────────────────────────────────────────────
 * publishable 키는 브라우저에 있어도 됩니다. RLS 가 지킵니다.
 * (secret / service_role 키는 절대 여기 두지 않습니다 — RLS 를 통째로 무시합니다.)
 * 저장 키에 t2 를 붙입니다. 도쿄 앱과 같은 github.io 도메인이라
 * localStorage 를 공유하기 때문입니다. 겹치면 여행 중에 터집니다. */
const SUPABASE_URL = 'https://qahqqhjleqfrsjiixnas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ymbrt_00OqzQjT3SrweZgQ_Lu0cw64V';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storageKey: 't2-auth', persistSession: true, autoRefreshToken: true }
});

const $ = id => document.getElementById(id);
const t0 = performance.now();
let failed = false;

function mark(n, ok, text){
  $('d'+n).className = 'dot ' + (ok ? 'ok' : 'bad');
  $('v'+n).textContent = text;
  if (!ok) failed = true;
}
function fail(e){
  $('errcard').hidden = false;
  $('err').textContent = (e && (e.message || e.hint || JSON.stringify(e))) || String(e);
}

try {
  /* count:'exact', head:true 면 행을 안 받고 개수만 옵니다. */
  const q = (t) => sb.from(t).select('*', { count:'exact', head:true });

  const [countries, cities, grades, lines] = await Promise.all([
    q('countries'), q('cities'), q('transit_grades'), q('transit_lines')
  ]);

  const first = [countries, cities, grades, lines].find(r => r.error);
  if (first) throw first.error;

  mark(0, true, '연결됨');
  mark(1, countries.count >= 56, countries.count + '개');
  mark(2, cities.count    >= 138, cities.count    + '개');
  mark(3, grades.count    === 4,  grades.count    + '개');
  mark(4, lines.count     >= 40,  lines.count     + '개');

  /* 로그인 안 한 상태에서 trips 가 비어 있어야 정상입니다.
     행이 나오면 RLS 가 안 걸린 것이라 남의 데이터가 보인다는 뜻입니다. */
  const trips = await sb.from('trips').select('id').limit(1);
  const blocked = !trips.error && (trips.data || []).length === 0;
  mark(5, blocked, blocked ? '막고 있음 (정상)' : '열려 있음 — 확인 필요');

  /* 등급별 이동 계산을 실제 값으로 보여줍니다. */
  const g = await sb.from('transit_grades')
                    .select('grade,label,walk_max_km,transit_factor,transit_base_min')
                    .order('walk_max_km', { ascending:false });
  if (!g.error && g.data?.length){
    $('gradecard').hidden = false;
    $('grades').innerHTML = g.data.map(r =>
      `<span class="chip">${r.label} · ${r.walk_max_km}km · ×${r.transit_factor}+${r.transit_base_min}분</span>`
    ).join('');
  }
} catch (e) {
  mark(0, false, '실패');
  fail(e);
}

$('ms').textContent = Math.round(performance.now() - t0) + 'ms';
document.title = failed ? '⚠ Travel' : 'Travel';
</script>
</body>
</html>
