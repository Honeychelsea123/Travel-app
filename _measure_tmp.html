<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="app.css">
<title>measure</title></head>
<body class="hastab">
<div id="analview" class="tabpane"><div id="analbox">

<div class="card quiet" style="position:relative">
  <button class="ghost" id="p_img" title="성향 카드 공유하기"
          style="position:absolute; top:6px; right:8px; padding:6px 8px">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none"
         stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/>
      <circle cx="18" cy="19" r="2.6"/>
      <path d="M8.3 10.8 15.7 6.4M8.3 13.2l7.4 4.4"/>
    </svg></button>
  <div class="ptop" style="cursor:default">
    <div class="pmeta"><div class="pcode">HLDG</div>
    <div class="pname">깊이 파는 사람</div>
    <span class="prank">상위 80%</span></div>
  </div>
  <div class="empty" style="text-align:center; padding:2px 6px 0">
    한 나라를 구석구석 다 훑는 타입
    <div class="memo" style="margin-top:6px">0개국 · 0도시</div>
  </div>
  <div class="axbars">
    <div class="axrow"><span class="axn"><b>개척력</b><span>숨은 곳</span></span>
      <span class="axbar"><i style="width:50%"></i></span><span class="axv">50</span></div>
  </div>
</div>

<div class="card quiet starcard">
  <h2>내 별점</h2>
  <div class="fpnums">
    <div><b>3.8</b><span>내 평균</span></div>
    <div><b>3.5</b><span>다른 사람 평균</span></div>
    <div><b>+0.3</b><span>차이</span></div>
  </div>
  <div class="memo">다른 사람보다 후하게 줍니다 · 견준 곳 12곳</div>
  <div class="picks"><span class="label">얼마나 알려진 곳에 갔나</span></div>
  <div class="famerow"><span>누구나 아는 곳</span><div class="fp"><i style="width:60%"></i></div><b>60%</b></div>
  <div class="picks"><span class="label">별점이 갈린 곳</span></div>
  <div class="gaprow" id="gap1"><b>세비야</b><span class="up">나 5.0</span><span>다른 사람 3.0 (1명)</span></div>
</div>

<div class="card quiet">
  <h2>다음 여행</h2>
  <div class="picks"><span class="label">어울리는 곳</span>
    <div class="cchips"><button id="chip1">그라나다</button><button>포르투</button><button>류블랴나</button></div>
  </div>
</div>

<div class="card">
  <div class="empty" style="padding:14px 10px">
    <b>도시 5곳</b>만 더 매기면 성향이 확정돼요.
    <div class="memo" style="margin-top:5px">지금 카드는 흔들릴 수 있어서 아직 공유는 못 해요</div>
    <div style="margin-top:12px"><button class="primary" id="pgo">평가하러 가기</button></div>
  </div></div>

</div></div>
<div id="cardsheet" style="position:static">
  <div class="cshead"><span>저장 미리보기</span>
    <button class="csx" id="cs_x" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
</div>
</body></html>
