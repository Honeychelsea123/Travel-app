<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>굴절 진단</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px 12px 40px;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  background:#111318;color:#eceef4;-webkit-font-smoothing:antialiased}
h1{font-size:17px;font-weight:600;margin:0 0 4px}
.lead{font-size:13px;color:#a8adbb;margin:0 0 18px}
.t{margin-bottom:20px}
.tl{font:600 13px/1.4 ui-monospace,monospace;margin-bottom:6px;color:#fff}
.tl b{color:#ffd479}
.tn{font-size:12px;color:#9aa0b0;margin:5px 2px 0}
/* 뒤에 깔리는 것 — 굵은 줄무늬. 흐림이 돌면 «줄이 뭉개져» 바로 보입니다. */
.stage{position:relative;height:118px;border-radius:16px;overflow:hidden;
  display:grid;place-items:center;
  background:
    repeating-linear-gradient(68deg,#ff5f5f 0 16px,#ffd166 16px 32px,
      #06d6a0 32px 48px,#4cc9f0 48px 64px,#b388ff 64px 80px)}
.stage .big{font:800 34px/1 -apple-system,sans-serif;color:#0b0d12;letter-spacing:-.02em}
/* 시험체 — 알약
   ⚠⚠ **transform 을 쓰면 안 됩니다.** transform 이 걸린 요소는 backdrop
     root 가 되어 **자식의 backdrop-filter 가 통째로 죽습니다**(b441 에서
     겪은 것). 가운데 정렬을 translate(-50%,-50%) 로 하면 ③④⑤가 엉뚱한
     이유로 실패해 진단이 거꾸로 나옵니다. 격자 겹치기로 정렬합니다. */
.stage > *{grid-area:1/1; place-self:center}
.pill{position:relative;
  width:74%;height:60px;border-radius:99px;z-index:2;
  display:grid;place-items:center;font:600 14px/1 inherit;color:#0b0d12;
  box-shadow:0 8px 24px rgba(0,0,0,.35)}
.RIM{position:absolute;inset:0;border-radius:inherit;pointer-events:none}

/* ① 지금 방식 — 부모에 필터 O + 가상요소 + XOR 마스크 */
.t1 .pill{background:rgba(255,255,255,.06);
  -webkit-backdrop-filter:saturate(190%) contrast(104%) blur(1px);
  backdrop-filter:saturate(190%) contrast(104%) blur(1px)}
.t1 .pill::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:10px;
  -webkit-backdrop-filter:blur(9px) brightness(1.14);backdrop-filter:blur(9px) brightness(1.14);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}

/* ② 부모 필터 없음 + 가상요소 + XOR 마스크 */
.t2 .pill{background:rgba(255,255,255,.06)}
.t2 .pill::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:10px;
  -webkit-backdrop-filter:blur(9px) brightness(1.14);backdrop-filter:blur(9px) brightness(1.14);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}

/* ③ 부모 필터 없음 + 형제 요소(진짜 div) + XOR 마스크 */
.t3 .pill{background:rgba(255,255,255,.06)}
.t3 .RIM{padding:10px;
  -webkit-backdrop-filter:blur(9px) brightness(1.14);backdrop-filter:blur(9px) brightness(1.14);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask-composite:exclude}

/* ④ 대조군 — 형제 요소, 마스크 아예 없음(판 전체가 흐려야 정상) */
.t4 .pill{background:rgba(255,255,255,.06)}
.t4 .RIM{-webkit-backdrop-filter:blur(9px) brightness(1.14);
  backdrop-filter:blur(9px) brightness(1.14)}

/* ⑤ 형제 요소 + XOR 안 씀. radial-gradient 로 가운데만 지웁니다 */
.t5 .pill{background:rgba(255,255,255,.06)}
.t5 .RIM{-webkit-backdrop-filter:blur(9px) brightness(1.14);
  backdrop-filter:blur(9px) brightness(1.14);
  -webkit-mask:radial-gradient(120% 260% at 50% 50%,transparent 58%,#000 74%);
  mask:radial-gradient(120% 260% at 50% 50%,transparent 58%,#000 74%)}

/* ⑥ backdrop-filter 를 아예 안 쓰는 흉내 — 언제나 도는 안전판 */
.t6 .pill{background:
    radial-gradient(120% 300% at 50% 50%,rgba(255,255,255,0) 55%,rgba(255,255,255,.34) 78%,
      rgba(255,255,255,.5));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),
             inset 0 -1.5px 0 rgba(255,255,255,.35),
             inset 0 0 14px rgba(255,255,255,.45),
             0 8px 24px rgba(0,0,0,.35)}
</style></head><body>
<h1>굴절이 왜 안 보이는지 가려내는 판</h1>
<p class="lead">뒤 줄무늬가 <b>알약 가장자리에서 뭉개져 보이면 «된 것»</b>입니다.
그냥 줄무늬가 또렷하게 지나가면 안 된 겁니다. <b>④번은 대조군</b>이라
판 전체가 뿌예야 정상입니다 — ④마저 또렷하면 backdrop-filter 자체가 안 도는 것입니다.
<b>보이는 번호만 알려주세요.</b></p>
<div id="w"></div>
<script>
const T=[
 ['① 지금 방식 — 부모 필터 O · 가상요소 · XOR 마스크','라이브에서 안 보인다고 하신 그것'],
 ['② 부모 필터 <b>X</b> · 가상요소 · XOR 마스크','겹친 필터가 범인인지'],
 ['③ 부모 필터 X · <b>형제 요소</b> · XOR 마스크','가상요소가 범인인지'],
 ['④ <b>대조군</b> — 형제 요소 · 마스크 없음','판 전체가 뿌예야 정상'],
 ['⑤ 형제 요소 · <b>radial 마스크</b>(XOR 안 씀)','mask-composite 가 범인인지'],
 ['⑥ <b>backdrop-filter 안 씀</b> — 그림자로 흉내','늘 도는 안전판. 유리처럼 보이나?']
];
document.getElementById('w').innerHTML=T.map((x,i)=>`
 <div class="t t${i+1}">
   <div class="tl">${x[0]}</div>
   <div class="stage"><span class="big">가나다 ABC 123</span>
     <div class="pill"><div class="RIM"></div>${i+1}</div></div>
   <div class="tn">${x[1]}</div>
 </div>`).join('');
</script></body></html>
